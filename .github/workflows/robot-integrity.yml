name: ROBOT integrity checks

on:
  # Every push to a branch in this repository.
  push:
    branches:
      - '**'
  # Pull requests from forks, which `push` doesn't cover. A PR from a branch
  # in this repository fires this trigger too, but the job below skips that
  # run, since the `push` run already checked the branch.
  # GitHub holds runs from first-time outside contributors until a maintainer
  # approves them (Settings > Actions > General).
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

env:
  ROBOT_VERSION: 1.9.10
  ROBOT_JAVA_ARGS: -Xmx4g

jobs:
  robot-integrity:
    # Run on every push, and on pull requests only when they come from a fork.
    # The skipped run for an in-repo PR gets a different name, so it can't
    # stand in for the required `robot-integrity` check that the push run
    # reports on the same commit.
    name: >-
      ${{ (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
          && 'robot-integrity (skipped: covered by push run)'
          || 'robot-integrity' }}
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache ROBOT jar
        uses: actions/cache@v6
        with:
          path: tests/scripts/.robot
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Install ROBOT
        run: tests/scripts/install-robot.sh

      - name: Run ROBOT integrity checks
        id: robot-check
        run: tests/scripts/robot-check.sh

      - name: Upload unsatisfiability explanation
        if: failure() && steps.robot-check.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: robot-unsatisfiable-explanation
          path: unsatisfiable-explanation.owl
          if-no-files-found: ignore

      - name: Run ROBOT report tests
        id: robot-report
        run: tests/scripts/robot-report-tests.sh

      - name: Upload ROBOT report
        if: failure() && steps.robot-report.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: robot-report
          path: robot-report.tsv
          if-no-files-found: ignore
